name: ctf-watch

# All services share the VM's network (network_mode: host) so that:
#  - the proxy can reach the CTF container on 127.0.0.1:<port>
#  - the dashboard is bound to 127.0.0.1 by default (not reachable from outside / zrok)

services:
  monitor:
    build: ./proxy
    image: ctf-watch-monitor
    container_name: ctf-watch
    network_mode: host
    environment:
      # optional: the CTF app is normally picked in the dashboard (CTFs tab). Set it to skip that step.
      CTF_TARGET: ${CTF_TARGET:-}
      CTF_NAME: ${CTF_NAME:-}
      PROXY_PORT: ${PROXY_PORT:-8888}
      PROXY_BIND: ${PROXY_BIND:-127.0.0.1}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      DASHBOARD_BIND: ${DASHBOARD_BIND:-127.0.0.1}
      DASHBOARD_USERS: ${DASHBOARD_USERS:-3}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NAME_GATE: ${NAME_GATE:-0}
      NAME_GATE_TITLE: ${NAME_GATE_TITLE:-Welcome to the CTF}
      DEMO: ${DEMO:-0}
      CONFIG_DIR: /app/config
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      # read-only, so the CTFs tab can list the other containers and their ports
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${DASHBOARD_PORT:-8080}/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---- demo only (./start.sh --demo) ----
  mock-ctf:
    profiles: ["demo"]
    build: ./demo/mock-ctf
    image: ctf-watch-mock-ctf
    container_name: ctf-watch-mock-ctf
    network_mode: host
    environment:
      PORT: ${MOCK_PORT:-3999}
    mem_limit: 64m

  simulator:
    profiles: ["demo"]
    build: ./demo/simulator
    image: ctf-watch-simulator
    container_name: ctf-watch-simulator
    network_mode: host
    environment:
      TARGET: http://127.0.0.1:${PROXY_PORT:-8888}
    depends_on:
      - monitor
      - mock-ctf
    mem_limit: 64m
