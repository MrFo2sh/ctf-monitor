# Override for Docker Desktop (Windows / macOS), where "network_mode: host" stays inside Docker's
# Linux VM and nothing would reach your browser. Here the container is on a named bridge network
# with the dashboard and proxy published on 127.0.0.1 of your machine.
# start.sh picks this file automatically on Desktop. On the Ubuntu VM this file is NOT used.
#
#   docker compose -f docker-compose.yml -f docker-compose.desktop.yml up -d --build

networks:
  ctfnet:

services:
  monitor:
    network_mode: !reset null
    networks: [ctfnet]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
      - "127.0.0.1:${PROXY_PORT:-8888}:${PROXY_PORT:-8888}"
    environment:
      DASHBOARD_BIND: 0.0.0.0
      PROXY_BIND: 0.0.0.0
      # discovery lists containers by their network ip, and probes common ports on your machine via host.docker.internal
      DISCOVERY_MODE: bridge
      # Desktop is a rehearsal setup: connections arrive from Docker's gateway, and the Playground's fake
      # students fake their addresses with X-Forwarded-For, so forwarded headers are believed from anyone here.
      TRUSTED_PROXIES: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
