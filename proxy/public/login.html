<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTF Watch Login</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f14; color:#e6edf3; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:#111820; border:1px solid #1f2a36; border-radius:10px; padding:30px 28px; width:min(92vw,360px); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  h1 i { width:9px; height:9px; border-radius:50%; background:#0ca30c; display:inline-block; }
  p { margin:0 0 18px; color:#8b98a5; font-size:13px; }
  label { display:block; font-size:12px; color:#8b98a5; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px; border-radius:6px; border:1px solid #2a3847; background:#0b0f14; color:#e6edf3; font-family:ui-monospace,Menlo,Consolas,monospace; }
  input:focus { outline:none; border-color:#3987e5; }
  button { margin-top:16px; width:100%; padding:11px; font-size:15px; font-weight:600; border:0; border-radius:6px; background:#3987e5; color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:#fab219; font-size:13px; margin-top:10px; min-height:1.2em; }
  .err.crit { color:#d03b3b; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1><i></i> CTF Watch</h1>
  <p>Organizer dashboard. The accounts are printed by <code>start.sh</code>.</p>
  <label for="u">Username</label><input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign in</button>
  <div class="err" id="e"></div>
</form>
<script>
  const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    b.disabled = true; e.textContent = ''; e.className = 'err';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'ctf-watch' }, body: JSON.stringify({ username: f.username.value.trim(), password: f.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.href = new URLSearchParams(location.search).get('next') || '/'; return; }
      e.textContent = j.error || ('error ' + r.status);
      if (r.status === 409 || r.status === 403) e.className = 'err crit';
    } catch (err) { e.textContent = 'network error'; }
    b.disabled = false;
  });
</script>
</body>
</html>
